server:
  port: 8080
  host: "0.0.0.0"

database:
  host: "localhost"
  port: 5432
  user: "mini-bk"
  password: "mini-bk"
  dbname: "mini-bk"
  sslmode: "disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

scheduler:
  tick_interval_ms: 500
  max_concurrent_tasks: 10

executor:
  default_timeout_sec: 300
  default_workdir: "/tmp"

retry:
  max_attempts: 3
  initial_interval_sec: 1
  max_interval_sec: 60
  multiplier: 2

rate_limit:
  enabled: true
  requests_per_minute: 100

grpc:
  port: 50051

agent:
  heartbeat_interval_sec: 10
  heartbeat_timeout_sec: 30
