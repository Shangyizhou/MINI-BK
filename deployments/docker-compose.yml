version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini-bk
      POSTGRES_PASSWORD: mini-bk
      POSTGRES_DB: mini-bk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      MINIBK_DATABASE_HOST: postgres
      MINIBK_REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis

  agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    command: ["./agent", "-server-addr=server:50051", "-labels=linux,test"]
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
