version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini-bk
      POSTGRES_PASSWORD: mini-bk
      POSTGRES_DB: mini-bk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.19
    command:
      - etcd
      - -listen-client-urls=http://0.0.0.0:2379
      - -advertise-client-urls=http://etcd:2379
    ports:
      - "2379:2379"

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      MINIBK_DATABASE_HOST: postgres
      MINIBK_REDIS_ADDR: redis:6379
      MINIBK_ETCD_ENDPOINTS: etcd:2379
    depends_on:
      - postgres
      - redis
      - etcd

  agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    command: ["./agent", "-server-addr=server:50051", "-labels=linux,test"]
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
